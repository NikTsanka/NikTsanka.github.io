<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Live clocks and current weather for cities around the world.">
  <title>World Time &amp; Weather</title>

  <link rel="icon" href="./icon.svg?v=5" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=5">
  <meta name="theme-color" content="#0e1c31">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="./css/tokens.css?v=5">
  <link rel="stylesheet" href="./css/styles.css?v=5">
  <link rel="stylesheet" href="./css/views.css?v=5">
  <link rel="stylesheet" href="./css/planner.css?v=5">
  <link rel="stylesheet" href="./css/chart.css?v=5">
  <link rel="stylesheet" href="./css/forecast.css?v=5">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="app-header__bar">
      <h1 class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="8.2"></circle>
            <path d="M12 12V6.9"></path><path d="m12 12 3.7 2.6"></path>
          </svg>
        </span>
        World Time <span class="brand__amp">&amp;</span> Weather
      </h1>

      <div class="app-header__actions">
        <button type="button" id="refresh-btn" class="icon-btn" aria-label="Refresh weather data">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v4h-4"></path>
          </svg>
        </button>

        <div class="settings">
          <button type="button" id="settings-btn" class="icon-btn" aria-label="Settings"
                  aria-expanded="false" aria-controls="settings-panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <div id="settings-panel" class="settings__panel" role="group" aria-label="Display settings" hidden></div>
        </div>
      </div>
    </div>

    <div class="search" role="search">
      <label class="visually-hidden" for="search-input">Search cities by name or country code</label>
      <span class="search__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path>
        </svg>
      </span>
      <input id="search-input" class="search__input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Add a city&hellip;" role="combobox" aria-expanded="false"
             aria-controls="search-results" aria-autocomplete="list" aria-describedby="search-hint">
      <p id="search-hint" class="visually-hidden">Use the up and down arrow keys to review results, Enter to add a city, Escape to close.</p>
      <button type="button" id="search-clear" class="icon-btn icon-btn--bare is-hidden" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
      <ul id="search-results" class="search__results is-hidden" role="listbox" aria-label="City search results"></ul>
    </div>

    <nav class="tabs" aria-label="Views">
      <a class="tabs__link" id="tab-dashboard" href="#">Cities</a>
      <a class="tabs__link" id="tab-planner" href="#planner">Planner</a>
      <a class="tabs__link" id="tab-zones" href="#zones">Time zones</a>
    </nav>
  </header>

  <div id="notice-area" class="notice-area" aria-live="polite"></div>

  <main id="main" class="main">
    <section id="dashboard" class="dashboard" aria-labelledby="dashboard-title">
      <div class="section-head">
        <h2 id="dashboard-title" class="section-title">Cities</h2>
        <p id="dashboard-meta" class="section-meta"></p>
      </div>
      <div id="card-grid" class="card-grid" aria-busy="true"></div>
      <div id="state-area" class="state-area"></div>
    </section>

    <div id="detail-root"></div>
    <div id="planner-root"></div>
    <div id="zones-root"></div>
  </main>

  <footer class="app-footer">
    <p>
      Data from <a href="https://worldtimeweather.com/">World Time &amp; Weather</a> &middot;
      Weather by <a href="https://open-meteo.com">Open-Meteo</a>
    </p>
    <p class="footer-credit">
      Built by <a href="https://canka.dev/" target="_blank" rel="noopener noreferrer"
                  class="canka-built-link">canka.dev<span class="blink-cursor" aria-hidden="true">_</span></a>
    </p>
  </footer>

  <!-- Classic scripts, explicit load order. No ES modules: a module script is blocked
       over file:// (origin null), and this app must run from a double-clicked file. -->
  <script defer src="./data/fixtures.js?v=5"></script>
  <script defer src="./js/storage.js?v=5"></script>
  <script defer src="./js/cache.js?v=5"></script>
  <script defer src="./js/units.js?v=5"></script>
  <script defer src="./js/weather.js?v=5"></script>
  <script defer src="./js/normalize.js?v=5"></script>
  <script defer src="./js/api.js?v=5"></script>
  <script defer src="./js/clock.js?v=5"></script>
  <script defer src="./js/settings.js?v=5"></script>
  <script defer src="./js/search.js?v=5"></script>
  <script defer src="./js/router.js?v=5"></script>
  <script defer src="./js/ui.js?v=5"></script>
  <script defer src="./js/dashboard.js?v=5"></script>
  <script defer src="./js/chart.js?v=5"></script>
  <script defer src="./js/forecast.js?v=5"></script>
  <script defer src="./js/detail.js?v=5"></script>
  <script defer src="./js/planner.js?v=5"></script>
  <script defer src="./js/zones.js?v=5"></script>
  <script defer src="./js/app.js?v=5"></script>
</body>
</html>
