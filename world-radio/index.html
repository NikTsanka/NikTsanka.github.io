<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Radio - Radio Hangi</title>
    <link rel="icon" type="image/png" href="/img/cover.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blur" id="bgBlur"></div>
    <div class="bg-overlay"></div>
    <div class="toast" id="toast"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="/" class="back-btn" title="Back to Radio Hangi">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="logo">
                <i class="fas fa-globe-europe logo-icon"></i>
                <span>World Radio</span>
            </div>
        </div>
        <div class="header-right">
            <button class="fav-view-btn" id="favViewBtn" onclick="toggleFavsView()" title="Your favorites">
                <i class="fas fa-heart"></i>
                <span class="fav-badge" id="favBadge">0</span>
            </button>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- Filters -->
    <section class="filters">
        <div class="search-wrap">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input"
                   placeholder="Search radio stations..."
                   oninput="onSearch()">
            <button class="search-clear" id="searchClear" onclick="clearSearch()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="filter-row">
            <div class="select-wrap">
                <i class="fas fa-globe-americas sel-icon"></i>
                <select id="countrySelect" class="filter-select" onchange="applyFilters()">
                    <option value="">All Countries</option>
                </select>
            </div>
            <div class="select-wrap">
                <i class="fas fa-sort sel-icon"></i>
                <select id="sortSelect" class="filter-select" onchange="applyFilters()">
                    <option value="votes">Top Rated</option>
                    <option value="clickcount">Most Popular</option>
                    <option value="bitrate">Best Quality</option>
                    <option value="name">A – Z</option>
                </select>
            </div>
        </div>
        <div class="genre-chips" id="genreChips">
            <span class="chips-loading"><i class="fas fa-spinner fa-spin"></i> Loading genres...</span>
        </div>
    </section>

    <!-- Results bar -->
    <div class="results-bar">
        <span class="results-count" id="resultsInfo">Loading...</span>
        <button class="clear-all-btn" id="clearAllBtn" onclick="clearAllFilters()">
            <i class="fas fa-times-circle"></i> Clear
        </button>
    </div>

    <!-- Stations -->
    <main class="stations-wrap">
        <div class="stations-grid" id="stationsGrid"></div>
        <div class="load-more-wrap" id="loadMoreWrap">
            <button class="load-more-btn" onclick="loadMore()">
                Load more <i class="fas fa-chevron-down"></i>
            </button>
        </div>
        <div class="empty-state" id="emptyState">
            <i class="fas fa-satellite-dish"></i>
            <p>No stations found</p>
            <span>Try different filters or search terms</span>
        </div>
    </main>

    <!-- Player Bar -->
    <div class="player-bar">
        <div class="player-left">
            <div class="player-art" id="playerArt">
                <i class="fas fa-radio"></i>
            </div>
            <div class="player-info">
                <div class="player-name" id="playerName">Select a station to play</div>
                <div class="player-sub" id="playerSub">World Radio</div>
            </div>
        </div>
        <div class="player-center">
            <button class="player-fav-btn" id="playerFavBtn" onclick="toggleCurrentFav()" title="Favorite">
                <i class="far fa-heart"></i>
            </button>
            <button class="player-play-btn" id="playerPlayBtn" onclick="togglePlay()" disabled>
                <i class="fas fa-play" id="playerPlayIcon"></i>
            </button>
            <div class="player-vol">
                <i class="fas fa-volume-up player-vol-icon" id="playerVolIcon" onclick="toggleMute()"></i>
                <input type="range" class="player-vol-slider" id="volSlider"
                       min="0" max="100" value="80"
                       oninput="setVolume(this.value)">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
